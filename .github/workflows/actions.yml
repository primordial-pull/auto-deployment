name: Step 1 - AWS & ECR Auth Test

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ap-northeast-2

# OIDC 토큰 발급을 위해 permissions 설정 필요
permissions:
  id-token: write
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Token Sub Claim
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "=== Actual OIDC 'sub' claim ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.sub'
          echo "================================"

      # OIDC 기반 AWS 인증 (액세스 키 대신 Role ARN 사용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
