name: Step 1 - Test & AWS/ECR Auth

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ap-northeast-2

# OIDC 토큰 발급을 위해 permissions 설정 필요
permissions:
  id-token: write
  contents: read

jobs:
  # 테스트가 통과해야만 이후 단계(인증/배포)로 진행
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 락파일과 package.json이 어긋나면 여기서 실패
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  test-auth:
    # unit-test 잡이 성공한 경우에만 실행
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # OIDC 기반 AWS 인증 (액세스 키 대신 Role ARN 사용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 검증 결과 출력
      - name: Verify Login Success
        run: echo "ECR Registry Subdomain -> ${{ steps.login-ecr.outputs.registry }}"